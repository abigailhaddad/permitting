# All classification and search patterns live here. Edit this file, then run
# `python3 classify.py` to re-classify (fast, local, no re-scan needed).
#
# How a posting gets its mention_type:
#   1. If ANY of its "permitting" contexts matches real_overrides -> real mention
#   2. Else if EVERY context matches an incidental pattern       -> probably incidental
#   3. Else                                                      -> real mention

incidental:
  # "<word> permitting" meaning "if <word> allows" (stock phrases)
  stock_phrases:
    - weather
    - time
    - schedule
    - workload
    - budget
    - funding
    - funds
    - resources
    - space
    - conditions
    - circumstances
    - staffing
    - census
    - mission
    - operations
    - duties

  # "permitting <word>" where permitting is a verb ("...a waiver determination
  # permitting you to retain bank securities" -- OCC pastes that into every
  # announcement). Single words that can follow verb-use "permitting".
  verb_following_words:
    - you
    - them
    - him
    - her
    - it
    - us
    - the
    - a
    - an
    - such
    - these
    - those
    - this
    - that
    - each
    - all
    - any
    - access
    - use
    - employees
    - new
    - current
    - retention
    - greater
    - more
    - entry
    - work    # "AFI 36-2104 permitting work on ... nuclear devices"

# If any context matches one of these (substring, case-insensitive), the
# posting is a real mention no matter what the incidental rules say.
real_overrides:
  - environmental permitting
  - environmental media permitting
  - air permitting
  - water permitting
  - npdes permitting
  - mbta permitting
  - federal permitting
  - project permitting
  - regulatory permitting
  - use permitting
  - permitting and compliance
  - permitting process
  - permitting program
  - permitting requirements
  - permitting actions
  - permitting activities
  - permitting and taxation          # TTB's Permitting Division (alcohol/tobacco permits)
  - certificates permitting the movement   # APHIS: issuing movement certificates IS permit work

# --- What we GRAB and what we FLAG -------------------------------------------
# Rule 1 (grab): scan_expanded.sh and update_current.sh collect any posting
#   matching ANY phrase below. Matching is case-insensitive with word
#   boundaries (so "rcra" no longer matches inside "aircraft").
# Rule 2 (flag): a posting is "likely permitting" if it matches
#   >= 1 core phrase, OR >= adjacent_threshold distinct adjacent phrases.
#   Otherwise it is "adjacent mention" (grabbed, but not flagged).
#   The word "permitting" itself only counts as core when the posting isn't
#   classified "probably incidental" by the rules at the top of this file.

expansion:
  core_phrases:
    - permitting
    - permit applications
    - permit issuance
    - permit review
    - permit processing
    - permits and licenses
    - licenses and permits
    - permit to drill
    - leasing and permitting
    - special use permit
    - npdes
    - national pollutant discharge elimination system
    - section 404
    - section 401
    - section 408
    - dredge and fill
    - incidental take
    - habitat conservation plan
    - biological opinion
    - water quality certification
    - fast-41
    - rivers and harbors act
  adjacent_phrases:
    - environmental review
    - national environmental policy act
    - nepa
    - environmental impact statement
    - environmental assessment
    - categorical exclusion
    - finding of no significant impact
    - record of decision
    - environmental compliance
    - clean water act
    - clean air act
    - safe drinking water act
    - rcra
    - cercla
    - coastal zone management act
    - marine mammal protection act
    - section 106
    - section 7 consultation
    - right-of-way
    - rights-of-way
  adjacent_threshold: 2
